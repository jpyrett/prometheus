# Host access for the Prometheus Postgres container (design choices entry 72).
# Passwords are scram-sha-256. A connection that is not SSL is rejected.
# Docker publishes 127.0.0.1 only. From inside the container that published port
# arrives from the bridge (172.16.0.0/12, or 10.0.0.0/8 on some installs), not from 127.0.0.1.

local     all     all                 scram-sha-256
hostssl   all     all     127.0.0.1/32    scram-sha-256
hostssl   all     all     ::1/128         scram-sha-256
hostssl   all     all     172.16.0.0/12   scram-sha-256
hostssl   all     all     10.0.0.0/8      scram-sha-256
hostnossl all     all     all             reject
host      all     all     all             reject
