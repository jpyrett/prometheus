<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Prometheus</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23FF6B2C'/%3E%3Cpath d='M16 5c1 5-4 6.5-4 11 0 1.6.8 2.8 1.8 3.6-.2-2.6 1.2-4.2 2.6-5.6.4 3 3.1 4 3.1 7.2 0 .9-.2 1.7-.6 2.4 2.4-1.2 4.1-3.6 4.1-6.8C23 11 17.9 9.8 16 5Z' fill='%231B0E05'/%3E%3C/svg%3E" />
    <script>
      /* theme before first paint: the remembered choice, else the system's */
      (function () {
        var theme = null;
        try { theme = localStorage.getItem("prometheus.theme"); } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
